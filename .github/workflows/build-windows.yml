name: Build RedXBrowser

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "**.cs"
      - "**.csproj"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Publish single-file Windows executable
        run: dotnet publish RedXBrowser.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o publish
      - name: Upload standalone EXE
        uses: actions/upload-artifact@v4
        with:
          name: RedXBrowser-Windows-x64
          path: publish/RedXBrowser.exe
          if-no-files-found: error
          compression-level: 0
