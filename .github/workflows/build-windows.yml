name: Build RedXBrowser

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore RedXBrowser.csproj

      - name: Build
        run: dotnet build RedXBrowser.csproj -c Release --no-restore

      - name: Publish self-contained single EXE
        run: dotnet publish RedXBrowser.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o publish

      - name: Verify executable exists
        shell: pwsh
        run: |
          if (!(Test-Path "publish/RedXBrowser.exe")) {
            throw "Expected publish/RedXBrowser.exe was not created."
          }
          Get-Item "publish/RedXBrowser.exe" | Select-Object Name, Length

      - name: Publish direct EXE download on GitHub Releases
        uses: ncipollo/release-action@v1
        with:
          tag: redxbrowser-latest
          name: RedXBrowser Latest
          body: "Automatically built standalone Windows x64 executable. Download RedXBrowser.exe directly; no app-folder extraction is needed."
          artifacts: "publish/RedXBrowser.exe"
          artifactErrorsFailBuild: true
          allowUpdates: true
          removeArtifacts: true
          replacesArtifacts: true
          makeLatest: true
          token: ${{ secrets.GITHUB_TOKEN }}
